[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plotloop-hypertext"
version = "0.5.4"
description = "Your Ambient, Async AI Personal Agent over Apple Messages (iMessage) — Local-First on Mac mini, Zero BlueBubbles Required."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "openai>=1.65.0",
    "browser-use>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/granken/plotloop-hypertext"
Repository = "https://github.com/granken/plotloop-hypertext"
Issues = "https://github.com/granken/plotloop-hypertext/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
hypertext = "hypertext.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hypertext*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
